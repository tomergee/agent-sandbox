{{$replicas_burst1 := DefaultParam .CL2_REPLICAS_BURST1 100}}
{{$replicas_total := DefaultParam .CL2_REPLICAS_TOTAL 200}}
{{$namespaces := DefaultParam .CL2_NAMESPACES 1}}
{{$qps := DefaultParam .CL2_QPS 100}}
{{$warmpool_size := DefaultParam .CL2_WARMPOOL_SIZE 200}}
{{$namespacePrefix := DefaultParam .CL2_NAMESPACE_PREFIX "agent-sandbox"}}
name: agent-sandbox-split-burst-load-test
namespace:
  number: {{$namespaces}}
  prefix: {{$namespacePrefix}}
tuningSets:
- name: BurstCreate
  qpsLoad:
    qps: {{$qps}}
steps:
- name: Start Startup Latency Measurement
  measurements:
  - Identifier: SandboxStartupLatency
    Method: PodStartupLatency
    Params:
      action: start
      labelSelector: "app=agent-sandbox-load-test"

- name: Setup Sandbox Template
  phases:
  - namespaceRange: {min: 1, max: {{$namespaces}}}
    replicasPerNamespace: 1
    tuningSet: BurstCreate
    objectBundle:
    - basename: template
      objectTemplatePath: "cluster-loader-sandbox-template.yaml"

- name: Setup Sandbox Warm Pool
  phases:
  - namespaceRange: {min: 1, max: {{$namespaces}}}
    replicasPerNamespace: 1
    tuningSet: BurstCreate
    objectBundle:
    - basename: warmpool
      objectTemplatePath: "cluster-loader-sandbox-warmpool-custom.yaml"

- name: Wait for Warm Pool Pods to be Ready
  measurements:
  - Identifier: WaitForWarmPoolPods
    Method: WaitForRunningPods
    Params:
      action: start
      labelSelector: "agents.x-k8s.io/pool"
      desiredPodCount: {{MultiplyInt $warmpool_size $namespaces}}

- name: Create Burst 1 Sandbox Claims
  phases:
  - namespaceRange: {min: 1, max: {{$namespaces}}}
    replicasPerNamespace: {{$replicas_burst1}}
    tuningSet: BurstCreate
    objectBundle:
    - basename: agent-claim
      objectTemplatePath: "cluster-loader-sandbox-claim.yaml"

- name: Wait for Burst 1 Sandbox Claims to be Ready
  measurements:
  - Identifier: WaitForBurst1SandboxClaims
    Method: WaitForGenericK8sObjects
    Params:
      action: start
      objectGroup: extensions.agents.x-k8s.io
      objectVersion: v1alpha1
      objectResource: sandboxclaims
      namespaceRange: {min: 1, max: {{$namespaces}}}
      successfulConditions: ["Ready=True"]
      failedConditions: []
      minDesiredObjectCount: {{MultiplyInt $replicas_burst1 $namespaces}}
      maxFailedObjectCount: 0
      timeout: 10m
      refreshInterval: 20ms

- name: Pause 20 Seconds Between Bursts
  measurements:
  - Identifier: WaitBetweenBursts
    Method: Sleep
    Params:
      duration: 20s

- name: Create Burst 2 Sandbox Claims
  phases:
  - namespaceRange: {min: 1, max: {{$namespaces}}}
    replicasPerNamespace: {{$replicas_total}}
    tuningSet: BurstCreate
    objectBundle:
    - basename: agent-claim
      objectTemplatePath: "cluster-loader-sandbox-claim.yaml"

- name: Wait for Burst 2 Sandbox Claims to be Ready
  measurements:
  - Identifier: WaitForBurst2SandboxClaims
    Method: WaitForGenericK8sObjects
    Params:
      action: start
      objectGroup: extensions.agents.x-k8s.io
      objectVersion: v1alpha1
      objectResource: sandboxclaims
      namespaceRange: {min: 1, max: {{$namespaces}}}
      successfulConditions: ["Ready=True"]
      failedConditions: []
      minDesiredObjectCount: {{MultiplyInt $replicas_total $namespaces}}
      maxFailedObjectCount: 0
      timeout: 10m
      refreshInterval: 20ms

- name: Pause for Data Collection
  measurements:
  - Identifier: WaitAfterReady
    Method: Sleep
    Params:
      duration: 15s

- name: Gather Results
  measurements:
  - Identifier: SandboxStartupLatency
    Method: PodStartupLatency
    Params:
      action: gather
      labelSelector: "app=agent-sandbox-load-test"

- name: Delete Sandbox Claims
  phases:
  - namespaceRange: {min: 1, max: {{$namespaces}}}
    replicasPerNamespace: 0
    tuningSet: BurstCreate
    objectBundle:
    - basename: agent-claim
      objectTemplatePath: "cluster-loader-sandbox-claim.yaml"

- name: Delete Sandbox Warm Pool
  phases:
  - namespaceRange: {min: 1, max: {{$namespaces}}}
    replicasPerNamespace: 0
    tuningSet: BurstCreate
    objectBundle:
    - basename: warmpool
      objectTemplatePath: "cluster-loader-sandbox-warmpool-custom.yaml"

- name: Delete Sandbox Templates
  phases:
  - namespaceRange: {min: 1, max: {{$namespaces}}}
    replicasPerNamespace: 0
    tuningSet: BurstCreate
    objectBundle:
    - basename: template
      objectTemplatePath: "cluster-loader-sandbox-template.yaml"
