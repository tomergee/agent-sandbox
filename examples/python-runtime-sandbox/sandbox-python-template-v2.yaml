apiVersion: extensions.agents.x-k8s.io/v1alpha1
kind: SandboxTemplate
metadata:
  name: sandbox-python-template-v2
  namespace: default
spec:
  podTemplate:
    metadata:
      labels:
        sandbox: my-python-sandbox
      annotations:
        test: "yes"
    spec:
      containers:
      - name: python-sandbox
        image: gcr.io/gke-ai-eco-dev/sandbox-runtime:v2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8888
