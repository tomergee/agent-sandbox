apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-lifecycle-daemon
  namespace: agent-sandbox-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandbox-lifecycle-daemon-role
rules:
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes", "sandboxes/status"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims", "sandboxclaims/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandbox-lifecycle-daemon-binding
subjects:
  - kind: ServiceAccount
    name: sandbox-lifecycle-daemon
    namespace: agent-sandbox-system
roleRef:
  kind: ClusterRole
  name: sandbox-lifecycle-daemon-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-lifecycle-daemon
  namespace: agent-sandbox-system
spec:
  selector:
    app: sandbox-lifecycle-daemon
  ports:
    - protocol: TCP
      port: 8085
      targetPort: 8085
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-lifecycle-daemon
  namespace: agent-sandbox-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sandbox-lifecycle-daemon
  template:
    metadata:
      labels:
        app: sandbox-lifecycle-daemon
    spec:
      serviceAccountName: sandbox-lifecycle-daemon
      containers:
        - name: lifecycle-daemon
          image: us-central1-docker.pkg.dev/gke-ai-eco-dev/agent-sandbox-repo/sandbox-lifecycle-daemon:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8085
          command:
            - /lifecycle-daemon
            - --port=8085
